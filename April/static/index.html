<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformer Vocabulary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Vocabulary Dictionary</h1>
    <div id="controls" style="text-align:center; margin-bottom:16px;">
        <form id="encode-form">
            <input id="text-input" type="text" placeholder="Enter text to encode" />
            <button id="encode-button" type="submit">Encode</button>
        </form>
        <div id="encoding-result" style="margin-top:10px;"></div>
    </div>
    <div id="vocab-container"></div>
    <script src="script.js"></script>
</body>
</html>
